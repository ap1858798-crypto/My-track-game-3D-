
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real 3D Truck Simulator</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial;background:#87ceeb}
#game{width:100vw;height:100vh}
#hud{
 position:absolute;top:10px;left:10px;color:white;
 background:#111b;padding:12px;border-radius:12px;
 font-size:15px;line-height:1.7
}
#controls{
 position:absolute;bottom:15px;left:0;width:100%;
 display:flex;justify-content:space-between;
 padding:10px;pointer-events:none
}
.group{display:grid;gap:7px;pointer-events:auto}
.row{display:flex;gap:7px;justify-content:center}
button{
 border:2px solid #ffffff88;border-radius:12px;
 background:#202a3add;color:white;
 font-size:17px;font-weight:bold;
 min-width:57px;height:55px;
 touch-action:none
}
button:active{background:#e18b19}
#actions{
 position:absolute;right:12px;top:12px;
 display:flex;flex-direction:column;gap:8px
}
#actions button{height:43px;font-size:13px}
#message{
 position:absolute;top:42%;width:100%;
 text-align:center;color:white;font-size:22px;
 font-weight:bold;text-shadow:2px 2px 5px black;
 pointer-events:none
}
</style>
</head>
<body>
<div id="game"></div>

<div id="hud">
🚛 TRUCK SIMULATOR 3D<br>
Speed: <span id="speed">0</span> km/h<br>
Mode: <span id="mode">Walking</span><br>
Gear: <span id="gear">N</span>
</div>

<div id="actions">
<button id="enter">ENTER TRUCK</button>
<button id="exit">EXIT TRUCK</button>
<button id="camera">CAMERA</button>
<button id="night">DAY / NIGHT</button>
<button id="horn">HORN 📢</button>
</div>

<div id="message">3D TRUCK SIMULATOR</div>

<div id="controls">
 <div class="group">
  <div class="row">
   <button id="forward">▲</button>
  </div>
  <div class="row">
   <button id="left">◀</button>
   <button id="back">▼</button>
   <button id="right">▶</button>
  </div>
 </div>
 <div class="group">
  <button id="run">RUN</button>
  <button id="brake">BRAKE</button>
  <button id="handbrake">STOP</button>
 </div>
</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
 }
}
</script>

<script type="module">
import * as THREE from "three";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb,90,350);

const camera = new THREE.PerspectiveCamera(
 65,innerWidth/innerHeight,0.1,1000
);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById("game").appendChild(renderer.domElement);

// LIGHT
const sun = new THREE.DirectionalLight(0xffffff,2);
sun.position.set(40,70,30);
sun.castShadow=true;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xffffff,0x526b43,2));

// MATERIALS
function mat(color){
 return new THREE.MeshStandardMaterial({color,roughness:.8});
}
const green=mat(0x398d35);
const black=mat(0x151515);
const white=mat(0xffffff);
const roadMat=mat(0x333333);

// GROUND
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(1000,1000),
 green
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// ROAD
const road=new THREE.Mesh(
 new THREE.PlaneGeometry(18,1000),
 roadMat
);
road.rotation.x=-Math.PI/2;
road.position.y=.025;
road.receiveShadow=true;
scene.add(road);

// ROAD LINES
for(let z=-480;z<500;z+=12){
 const line=new THREE.Mesh(
  new THREE.BoxGeometry(.25,.04,6),
  white
 );
 line.position.set(0,.06,z);
 scene.add(line);
}

// BUILDING
function building(x,z){
 const h=5+Math.random()*12;
 const b=new THREE.Mesh(
  new THREE.BoxGeometry(9,h,9),
  mat([0xc5a27a,0xb8c9d9,0xd4b5a0,0xc5c5c5][Math.floor(Math.random()*4)])
 );
 b.position.set(x,h/2,z);
 b.castShadow=true;
 scene.add(b);
 for(let y=2;y<h-1;y+=3){
  for(let x2=-2;x2<=2;x2+=4){
   const w=new THREE.Mesh(
    new THREE.BoxGeometry(1.5,1.5,.15),
    mat(0x69b9dc)
   );
   w.position.set(x+x2,y,z-4.58);
   scene.add(w);
  }
 }
}

// TREES
function tree(x,z){
 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.35,.5,3,8),
  mat(0x704020)
 );
 trunk.position.set(x,1.5,z);
 scene.add(trunk);
 const leaves=new THREE.Mesh(
  new THREE.SphereGeometry(2.3,9,8),
  mat(0x146b26)
 );
 leaves.position.set(x,4,z);
 leaves.castShadow=true;
 scene.add(leaves);
}

for(let z=-450;z<450;z+=30){
 building(-22,z);
 building(22,z+12);
 tree(-12,z+10);
 tree(13,z+20);
}

// TRUCK
const truck=new THREE.Group();
scene.add(truck);

const chassis=new THREE.Mesh(
 new THREE.BoxGeometry(3,1,7),
 mat(0x252525)
);
chassis.position.y=1.1;
truck.add(chassis);

const cabin=new THREE.Mesh(
 new THREE.BoxGeometry(3,2.5,2.5),
 mat(0xe51b23)
);
cabin.position.set(0,2.3,2);
truck.add(cabin);

const glass=new THREE.Mesh(
 new THREE.BoxGeometry(2.55,1.1,.08),
 mat(0x75c9e8)
);
glass.position.set(0,2.75,.72);
truck.add(glass);

const cargo=new THREE.Mesh(
 new THREE.BoxGeometry(2.9,2.5,3.8),
 mat(0x1766ba)
);
cargo.position.set(0,2.4,-2);
truck.add(cargo);

// TRUCK WHEELS
const wheels=[];
function makeWheel(x,z){
 const wheel=new THREE.Mesh(
  new THREE.CylinderGeometry(.65,.65,.45,20),
  black
 );
 wheel.rotation.z=Math.PI/2;
 wheel.position.set(x,.7,z);
 truck.add(wheel);
 wheels.push(wheel);
 const hub=new THREE.Mesh(
  new THREE.CylinderGeometry(.25,.25,.47,12),
  mat(0xaaaaaa)
 );
 hub.rotation.z=Math.PI/2;
 hub.position.copy(wheel.position);
 truck.add(hub);
}
for(const z of [-2.8,2.1]){
 makeWheel(-1.55,z);
 makeWheel(1.55,z);
}

// PERSON
const person=new THREE.Group();
scene.add(person);

const skin=mat(0xe7aa78);
const shirt=mat(0x1764d0);
const pants=mat(0x202d4c);

const body=new THREE.Mesh(
 new THREE.BoxGeometry(.7,1,.38),shirt
);
body.position.y=1.65;
person.add(body);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(.28,16,16),skin
);
head.position.y=2.35;
person.add(head);

// LIMBS
const limbs=[];
function limb(x,y,length,material){
 const pivot=new THREE.Group();
 pivot.position.set(x,y,0);
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(.22,length,.24),material
 );
 mesh.position.y=-length/2;
 pivot.add(mesh);
 person.add(pivot);
 limbs.push(pivot);
 return pivot;
}
const arm1=limb(-.48,2.05,.75,skin);
const arm2=limb(.48,2.05,.75,skin);
const leg1=limb(-.22,1.2,.9,pants);
const leg2=limb(.22,1.2,.9,pants);

// TRUCK START POSITION
truck.position.set(0,0,8);
person.position.set(4,0,8);

let driving=false;
let speed=0;
let steering=0;
let walkingSpeed=0;
let cameraMode=0;
let isNight=false;
let run=false;

const keys={};
const touch={};

// KEYBOARD
window.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key.toLowerCase()==="e") toggleTruck();
 if(e.key.toLowerCase()==="c") changeCamera();
 if(e.key.toLowerCase()==="h") horn();
 if(e.key.toLowerCase()==="n") toggleNight();
});
window.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

// MOBILE BUTTONS
function hold(id,key){
 const el=document.getElementById(id);
 el.addEventListener("pointerdown",e=>{
  e.preventDefault();
  touch[key]=true;
 });
 const stop=()=>{
  touch[key]=false;
 };
 el.addEventListener("pointerup",stop);
 el.addEventListener("pointerleave",stop);
 el.addEventListener("pointercancel",stop);
}
hold("forward","forward");
hold("back","back");
hold("left","left");
hold("right","right");
hold("brake","brake");
hold("run","run");
hold("handbrake","stop");

function pressed(k){
 return !!(keys[k]||touch[k]);
}

// ENTER AND EXIT
function toggleTruck(){
 if(!driving){
  if(person.position.distanceTo(truck.position)>7)return;
  driving=true;
  person.visible=false;
  speed=0;
 }else{
  driving=false;
  person.visible=true;
  person.position.set(
   truck.position.x+3,0,truck.position.z
  );
  person.rotation.y=truck.rotation.y;
 }
 updateUI();
}

document.getElementById("enter").onclick=()=>{
 if(!driving)toggleTruck();
};
document.getElementById("exit").onclick=()=>{
 if(driving)toggleTruck();
};

function updateUI(){
 document.getElementById("mode").textContent=
 driving?"Driving":"Walking";
 document.getElementById("gear").textContent=
 speed>0?"D":speed<0?"R":"N";
}
function changeCamera(){
 cameraMode=(cameraMode+1)%3;
}
document.getElementById("camera").onclick=changeCamera;

// DAY NIGHT
function toggleNight(){
 isNight=!isNight;
 scene.background=new THREE.Color(isNight?0x07152d:0x87ceeb);
 scene.fog.color.copy(scene.background);
 sun.intensity=isNight?.3:2;
}
document.getElementById("night").onclick=toggleNight;

// HORN SOUND
let audio;
function horn(){
 try{
  audio ||= new AudioContext();
  const osc=audio.createOscillator();
  const gain=audio.createGain();
  osc.frequency.value=250;
  gain.gain.value=.15;
  osc.connect(gain);
  gain.connect(audio.destination);
  osc.start();
  osc.stop(audio.currentTime+.35);
 }catch(e){}
}
document.getElementById("horn").onclick=horn;

// ANIMATION
let last=performance.now();
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.04);
 last=now;

 if(driving){
  if(pressed("forward"))speed+=12*dt;
  if(pressed("back"))speed-=12*dt;
  if(pressed("brake"))speed*=.94;
  if(pressed("stop"))speed*=.8;

  speed=THREE.MathUtils.clamp(speed,-12,35);

  if(!pressed("forward")&&!pressed("back")){
   speed*=Math.pow(.985,dt*60);
  }

  if(pressed("left"))steering=1;
  else if(pressed("right"))steering=-1;
  else steering=0;

  truck.rotation.y+=steering*speed*.025*dt;
  truck.position.x+=Math.sin(truck.rotation.y)*speed*dt;
  truck.position.z+=Math.cos(truck.rotation.y)*speed*dt;

  wheels.forEach(w=>w.rotation.x+=speed*dt*1.5);
 }else{
  let moving=false;
  const fast=pressed("run")?8:4;

  if(pressed("forward")){
   person.position.x+=Math.sin(person.rotation.y)*fast*dt;
   person.position.z+=Math.cos(person.rotation.y)*fast*dt;
   moving=true;
  }
  if(pressed("back")){
   person.position.x-=Math.sin(person.rotation.y)*fast*dt;
   person.position.z-=Math.cos(person.rotation.y)*fast*dt;
   moving=true;
  }
  if(pressed("left")){
   person.rotation.y+=2.5*dt;
  }
  if(pressed("right")){
   person.rotation.y-=2.5*dt;
  }

  walkingSpeed=moving?fast:0;
  limbs[0].rotation.x=moving?Math.sin(now*.012)*.6:0;
  limbs[1].rotation.x=moving?-Math.sin(now*.012)*.6:0;
  limbs[2].rotation.x=moving?-Math.sin(now*.012)*.6:0;
  limbs[3].rotation.x=moving?Math.sin(now*.012)*.6:0;
 }

 // CAMERA
 let target;
 let cameraPosition;

 if(driving){
  if(cameraMode===0){
   target=truck.position.clone();
   target.y+=2;
   cameraPosition=new THREE.Vector3(
    truck.position.x-Math.sin(truck.rotation.y)*12,
    truck.position.y+7,
    truck.position.z-Math.cos(truck.rotation.y)*12
   );
  }else if(cameraMode===1){
   target=truck.position.clone();
   target.y+=2;
   cameraPosition=new THREE.Vector3(
    truck.position.x,
    truck.position.y+3,
    truck.position.z+1
   );
  }else{
   target=truck.position.clone();
   target.y+=2;
   cameraPosition=new THREE.Vector3(
    truck.position.x+12,
    truck.position.y+5,
    truck.position.z+12
   );
  }
 }else{
  target=person.position.clone();
  target.y+=1.4;
  cameraPosition=new THREE.Vector3(
   person.position.x-Math.sin(person.rotation.y)*8,
   person.position.y+5,
   person.position.z-Math.cos(person.rotation.y)*8
  );
 }

 camera.position.lerp(cameraPosition,1-Math.pow(.001,dt));
 camera.lookAt(target);

 document.getElementById("speed").textContent=
 Math.round(Math.abs(speed)*3.6);

 updateUI();
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);

// RESIZE
window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
